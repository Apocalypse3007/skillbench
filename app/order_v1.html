<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order Entry</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
  .field { margin: 8px 0; }
  .field label { display: inline-block; width: 110px; font-weight: bold; }
  table { border-collapse: collapse; margin: 12px 0; }
  th, td { border: 1px solid #ccc; padding: 4px 6px; }
  #status { margin-top: 12px; font-weight: bold; }
</style>
</head>
<body>
<h1>Order Entry</h1>

<div class="field"><label for="customer">Customer</label><select id="customer" name="customer"></select></div>
<div class="field"><label for="po_number">PO Number</label><input id="po_number" name="po_number" type="text"></div>
<div class="field"><label for="ship_by">Ship By</label><input id="ship_by" name="ship_by" type="date"></div>

<table id="lines">
  <thead><tr><th>SKU</th><th>Color</th><th>Size</th><th>Quantity</th><th>Unit Price</th></tr></thead>
  <tbody></tbody>
</table>
<button id="add_line" type="button">Add Line Item</button>

<div class="field"><label for="notes">Notes</label><textarea id="notes" name="notes" rows="3" cols="50"></textarea></div>
<button id="submit_order" type="button">Submit Order</button>
<div id="status" role="status"></div>

<script>
window.FORM = {
  customer: "#customer", po: "#po_number", ship: "#ship_by", notes: "#notes",
  addBtn: "#add_line", submitBtn: "#submit_order",
  rows: "#lines tbody", row: "tr", rowTag: "tr",
  rowHtml: '<tr>' +
    '<td><input class="sku" name="sku_{n}" type="text"></td>' +
    '<td><select class="color" name="color_{n}"></select></td>' +
    '<td><select class="size" name="size_{n}"></select></td>' +
    '<td><input class="qty" name="qty_{n}" type="number" min="0"></td>' +
    '<td><input class="price" name="price_{n}" type="number" step="0.01" min="0"></td>' +
    '</tr>',
  fields: { sku: ".sku", color: ".color", size: ".size", qty: ".qty", unit_price: ".price" },
  labels: { customer: "Customer", po: "PO Number" },
};
</script>
<script src="app.js"></script>
</body>
</html>
